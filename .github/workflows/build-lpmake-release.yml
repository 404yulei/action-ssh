name: Build lpmake (Standalone) & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 独立编译非常快，30分钟绰绰有余

    steps:
      - name: Checkout android-lptools
        uses: actions/checkout@v4
        with:
          repository: itsNileshHere/android-lptools
          path: android-lptools
          # 如果希望固定版本，可以取消注释并指定 branch 或 ref
          # ref: android-14 

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make

      - name: Build lpmake and other tools
        run: |
          cd android-lptools
          chmod +x make.sh
          ./make.sh

      - name: Verify lpmake binary
        run: |
          cd android-lptools
          LPMake_BIN="bin/lpmake"
          if [ ! -f "$LPMake_BIN" ]; then
            echo "ERROR: lpmake not found at $LPMake_BIN"
            echo "Listing bin/ directory:"
            ls -la bin/
            exit 1
          fi
          echo "Found lpmake:"
          file "$LPMake_BIN"
          # 简单验证可执行性（输出 usage 信息即视为正常）
          "$LPMake_BIN" --help 2>&1 | head -5 || true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android-lptools/bin/lpmake release-assets/lpmake
          # 可选：一并打包 lpunpack、lpdump 等常用工具
          # cp android-lptools/bin/lpunpack release-assets/ 2>/dev/null || true
          # cp android-lptools/bin/lpdump release-assets/ 2>/dev/null || true
          ls -l release-assets/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpmake-${{ github.ref_name }}
          path: release-assets/

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/lpmake
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
