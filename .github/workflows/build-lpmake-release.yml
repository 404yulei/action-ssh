name: Build lpmake (Standalone) & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to GitHub Release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout android-lptools
        uses: actions/checkout@v4
        with:
          repository: itsNileshHere/android-lptools
          path: android-lptools

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make

      # ── 修复 GCC 14+ 缺少 <algorithm> 头文件的问题 ──────────────
      - name: Patch utility.cpp for std::find
        run: |
          TARGET_FILE="android-lptools/lib/liblp/utility.cpp"
          if [ ! -f "$TARGET_FILE" ]; then
            echo "ERROR: $TARGET_FILE not found"
            exit 1
          fi
          # 检查是否已包含 <algorithm>，避免重复插入
          if grep -q '#include <algorithm>' "$TARGET_FILE"; then
            echo "Header already present, skipping patch."
          else
            # 在文件第一行插入 #include <algorithm>
            sed -i '1i #include <algorithm>' "$TARGET_FILE"
            echo "Patched successfully. New first lines:"
            head -5 "$TARGET_FILE"
          fi

      - name: Build lpmake and other tools
        run: |
          cd android-lptools
          chmod +x make.sh
          ./make.sh

      - name: Verify lpmake binary
        run: |
          cd android-lptools
          LPMake_BIN="bin/lpmake"
          if [ ! -f "$LPMake_BIN" ]; then
            echo "ERROR: lpmake not found at $LPMake_BIN"
            echo "Listing bin/ directory:"
            ls -la bin/
            exit 1
          fi
          echo "Found lpmake:"
          file "$LPMake_BIN"
          "$LPMake_BIN" --help 2>&1 | head -5 || true

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          cp android-lptools/bin/lpmake release-assets/lpmake
          ls -l release-assets/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpmake-${{ github.ref_name }}
          path: release-assets/

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          files: release-assets/lpmake
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
