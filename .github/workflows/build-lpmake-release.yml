name: Build lpmake & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Free disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/share/swift /usr/local/graalvm /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo apt-get clean
          echo "=== After cleanup ==="
          df -h /

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Repo init
        run: |
          mkdir -p aosp && cd aosp
          repo init \
            -u https://android.googlesource.com/platform/manifest \
            -b android-15.0.0_r25 \
            --depth=1

      - name: Minimal repo sync
        run: |
          cd aosp
          repo sync -c -j$(nproc) --force-sync --no-tags --no-clone-bundle \
            build/soong \
            build/make \
            build/blueprint \
            prebuilts/go/linux-x86 \
            prebuilts/build-tools \
            prebuilts/clang/host/linux-x86 \
            system/core \
            system/logging \
            system/extras \
            external/e2fsprogs \
            external/zlib \
            external/selinux \
            external/pcre \
            external/golang-protobuf \
            external/starlark-go \
            external/go-cmp

      - name: Verify Python and Ninja
        run: |
          cd aosp
          PYTHON_BIN="prebuilts/build-tools/path/linux-x86/python3"
          if [ ! -x "$PYTHON_BIN" ]; then
            PYTHON_BIN="prebuilts/build-tools/linux-x86/bin/python3"
          fi
          if [ ! -x "$PYTHON_BIN" ]; then
            echo "ERROR: Python3 not found."
            find prebuilts/build-tools -name 'python*' -type f 2>/dev/null | head -20
            exit 1
          fi
          echo "Python: $PYTHON_BIN"; "$PYTHON_BIN" --version

          NINJA_BIN="prebuilts/build-tools/linux-x86/bin/ninja"
          if [ ! -x "$NINJA_BIN" ]; then
            echo "ERROR: Ninja not found at $NINJA_BIN"; exit 1
          fi
          echo "Ninja: $NINJA_BIN"; "$NINJA_BIN" --version

      - name: Build lpmake
        run: |
          cd aosp
          source build/envsetup.sh
          lunch aosp_arm64-trunk_staging-eng
          make lpmake -j$(nproc)

      - name: Collect lpmake binary
        run: |
          cd aosp
          LPMake_PATH="out/host/linux-x86/bin/lpmake"
          if [ ! -f "$LPMake_PATH" ]; then
            echo "ERROR: lpmake not found at $LPMake_PATH"
            find out/host -name 'lpmake*' -type f 2>/dev/null || true
            exit 1
          fi
          mkdir -p "${GITHUB_WORKSPACE}/release-assets"
          cp "$LPMake_PATH" "${GITHUB_WORKSPACE}/release-assets/lpmake"
          file "${GITHUB_WORKSPACE}/release-assets/lpmake"
          ldd "${GITHUB_WORKSPACE}/release-assets/lpmake" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lpmake-${{ github.ref_name }}
          path: release-assets/

      - name: Release to GitHub
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/lpmake
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
